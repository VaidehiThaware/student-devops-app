apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-devops-app
  labels:
    app: student-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-devops-app
  template:
    metadata:
      labels:
        app: student-devops-app
    spec:
      containers:
        - name: student-devops-app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "VERSION_PLACEHOLDER"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
